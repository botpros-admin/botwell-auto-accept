name: secret-policy
on:
  push:
  pull_request:
jobs:
  enforce:
    uses: botpros-admin/org-policy-workflows/.github/workflows/secret-policy.yml@main
    # PUBLIC repo: GitHub's runners are free for public repos, and a self-hosted runner must never take a public repo's
    # jobs (anyone's pull request would run on our machines). The only repo that passes ubuntu-latest.
    with:
      runs-on: '"ubuntu-latest"'
